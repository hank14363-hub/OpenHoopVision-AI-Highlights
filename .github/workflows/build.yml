name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          LATEST_XCODE="$(find /Applications -name 'Xcode*.app' -prune -print | sort -V | tail -n 1)"
          test -n "$LATEST_XCODE"
          sudo xcode-select --switch "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Validate source changes
        shell: bash
        run: |
          set -euo pipefail
          test -f "AI Highlights.xcodeproj/project.pbxproj"
          REVIEW_VIEWS="$(find . -name ReviewView.swift -type f -print)"
          test -n "$REVIEW_VIEWS"
          printf '%s\n' "$REVIEW_VIEWS"

      - name: Build Xcode project
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "AI Highlights.xcodeproj" \
            -scheme "AI Highlights" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            build 2>&1 | tee build.log

      - name: Show compiler diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if grep -n -E 'error:|fatal error:' build.log; then
            exit 1
          fi
          tail -n 200 build.log
          exit 1

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          rm -rf Payload AI_Highlights_Unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AI_Highlights_Unsigned.ipa
          unzip -l AI_Highlights_Unsigned.ipa | head -n 20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: AI_Highlights_Unsigned.ipa
          if-no-files-found: error
